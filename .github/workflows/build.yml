name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # Only WTL is needed to compile, the image libraries are committed as prebuilt binaries
      - name: Get WTL
        run: git submodule update --init deps/WTL-sf

      # the program needs ATL, older runner images do not have it
      - name: Add ATL to Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --nocache" -Wait -PassThru
          "vs_installer exit code: $($p.ExitCode)"
          if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue)) { throw "ATL was not installed" }

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild src\LucidViewer.sln /t:WICLoader /t:LucidViewer /p:Configuration=Release /p:Platform=x64 /m /v:m

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Item src\LucidViewer\bin\x64\Release\LucidViewer.exe).VersionInfo
          "version=$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart)" >> $env:GITHUB_OUTPUT
          # 4-part version SignPath compares with the version resources
          "fileversion=$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)" >> $env:GITHUB_OUTPUT

      # Code signing with SignPath (docs/CODE_SIGNING.md), only for version tags and only once the
      # SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable are set up
      - name: Upload unsigned program
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-program
          path: |
            src/LucidViewer/bin/x64/Release/LucidViewer.exe
            src/LucidViewer/bin/x64/Release/WICLoader.dll

      - name: Sign program
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lucid-viewer
          signing-policy-slug: release-signing
          artifact-configuration-slug: program
          parameters: |
            version: "${{ steps.version.outputs.fileversion }}"
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # time for the manual approval in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-program

      - name: Use the signed program
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: Copy-Item signed-program\* src\LucidViewer\bin\x64\Release\ -Force

      - name: Portable zip
        shell: pwsh
        run: |
          $out = "LucidViewer-${{ steps.version.outputs.version }}-portable-x64"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item src\LucidViewer\bin\x64\Release\* $out -Exclude *.pdb,*.lib,*.exp,*.ilk,*.iobj,*.ipdb
          # the portable version keeps its settings next to the program
          $ini = "$out\LucidViewer.ini"
          # no byte order mark, the Windows INI functions would not find the first section
          [IO.File]::WriteAllText($ini, ([IO.File]::ReadAllText($ini) -replace '(?m)^StoreToEXEPath=false', 'StoreToEXEPath=true'), (New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip"

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LucidViewer.iss

      - name: Upload unsigned installer
        id: unsignedsetup
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: installer/Output/*.exe

      - name: Sign installer
        if: steps.unsignedsetup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lucid-viewer
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          parameters: |
            version: "${{ steps.version.outputs.fileversion }}"
          github-artifact-id: ${{ steps.unsignedsetup.outputs.artifact-id }}
          wait-for-completion: true
          # time for the manual approval in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer/Output

      - uses: actions/upload-artifact@v4
        with:
          name: LucidViewer-${{ steps.version.outputs.version }}
          path: |
            LucidViewer-*-portable-x64.zip
            installer/Output/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # SignPath requires the words "Code signing policy" on the download page
          body: |
            See the [changelog](https://github.com/cemmgrgn/lucid-viewer/blob/main/CHANGELOG.md) for what is new.

            [Code signing policy](https://github.com/cemmgrgn/lucid-viewer/blob/main/docs/CODE_SIGNING.md)
          files: |
            LucidViewer-*-portable-x64.zip
            installer/Output/*.exe
