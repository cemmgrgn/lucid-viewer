name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'docs/brand/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the page uses the README screenshots and the logo
      - name: Assemble the site
        run: |
          mkdir _site
          cp site/* _site/
          cp -r docs/images _site/images
          cp -r docs/brand _site/brand
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
